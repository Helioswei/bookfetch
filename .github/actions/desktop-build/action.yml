name: desktop-build
description: |
  Shared build: install deps → pytest gate → PyInstaller → zip.
  Caller supplies the zip name; the zip lands in the repo root.

inputs:
  zip-name:
    description: Artifact zip file name, e.g. bookfetch-macos-arm64.zip
    required: true

runs:
  using: composite
  steps:
    # 注意：调用方 workflow 必须先 actions/checkout（相对路径 composite 依赖仓库内容）
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.12"

    - name: Install deps (gui + dev + build)
      shell: bash
      # UV_PYTHON_PREFERENCE=only-managed：强制 uv 用 standalone python（与本地打包
      # 环境同构），防止捡 runner 系统 framework python（/usr/local/bin/python3.12）
      # ——framework build 自带 openssl、CA 路径指向构建机 → 打包后证书加载空，
      # GitHub 包全源 SSL CERTIFICATE_VERIFY_FAILED（实测 2026-09-05）
      env:
        UV_PYTHON_PREFERENCE: only-managed
        UV_PYTHON_DOWNLOADS: automatic
      run: uv sync --extra gui --group dev --group build

    - name: Tests
      shell: bash
      run: uv run pytest tests/ -q

    - name: Build translation assets (macOS, gitignored 产物 spec datas 需要)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        bash packaging/build_translator.sh
        bash packaging/build_activator.sh

    - name: Build (macOS, via bookfetch.spec)
      if: runner.os == 'macOS'
      shell: bash
      run: uv run pyinstaller bookfetch.spec --noconfirm

    - name: Build (Windows, equivalent CLI flags)
      if: runner.os == 'Windows'
      shell: pwsh
      run: uv run pyinstaller --noconfirm --windowed --name bookfetch --collect-all webview --add-data "src/bookfetch/static;bookfetch/static" packaging/desktop_entry.py

    - name: Package zip (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: cd dist && zip -rqy ../${{ inputs.zip-name }} bookfetch.app

    - name: Package zip (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Compress-Archive -Path dist/bookfetch -DestinationPath ${{ inputs.zip-name }} -Force
