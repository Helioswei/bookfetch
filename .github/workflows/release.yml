name: release

# 打 tag v* → 构建 mac/win 桌面包并挂到该 tag 的 GitHub Release。
# 一条命令发版：bash scripts/release.sh（tag 自动取 pyproject.toml version）

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-26          # Apple 芯片 (M1+)，macOS 26 镜像（翻译桥需 26 SDK）；Intel Mac 走 CLI/PyPI
            zip: bookfetch-macos-arm64.zip
          - label: windows-x64
            os: windows-latest
            zip: bookfetch-windows-x64.zip
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/desktop-build
        with:
          zip-name: ${{ matrix.zip }}

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.zip }}
          generate_release_notes: true
