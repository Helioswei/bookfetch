name: build-desktop

# 打 tag v*（如 v0.4.0）→ 自动构建 mac/win 桌面包并上传到该 tag 的 GitHub Release；
# 也可在 Actions 页手动 Run workflow（只出构建产物 artifact，不传 Release）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-14          # Apple 芯片 (M1+)；Intel Mac 走 CLI/PyPI
            zip: bookfetch-macos-arm64.zip
          - label: windows-x64
            os: windows-latest
            zip: bookfetch-windows-x64.zip
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install deps (gui + dev)
        run: uv sync --extra gui --group dev

      - name: Tests
        run: uv run pytest tests/ -q

      - name: Build (macOS, via bookfetch.spec)
        if: runner.os == 'macOS'
        run: uv run pyinstaller bookfetch.spec --noconfirm

      - name: Build (Windows, equivalent CLI flags)
        if: runner.os == 'Windows'
        shell: pwsh
        run: uv run pyinstaller --noconfirm --windowed --name bookfetch --collect-all webview --add-data "src/bookfetch/static;bookfetch/static" packaging/desktop_entry.py

      - name: Package zip (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -rqy ../${{ matrix.zip }} bookfetch.app

      - name: Package zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/bookfetch -DestinationPath ${{ matrix.zip }} -Force

      - name: Upload artifact (always, for manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}
          if-no-files-found: error

      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.zip }}
          generate_release_notes: true
