name: build

# 每次推 main → 自动构建 mac/win 桌面包 → Actions artifact（最新包随时可取）；
# 正式对外发布打 tag（见 release.yml）。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-26          # Apple 芯片 (M1+)，macOS 26 镜像（翻译桥需 26 SDK）；Intel Mac 走 CLI/PyPI
            zip: bookfetch-macos-arm64.zip
          - label: windows-x64
            os: windows-latest
            zip: bookfetch-windows-x64.zip
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/desktop-build
        with:
          zip-name: ${{ matrix.zip }}

      # archive: false = 单文件原样上传，GitHub 不再包 zip 层（v7 参数；v4 无此参数且会强制再包层 → 用户解压两次）
      # zip 由 action.yml 打（zip -rqy 保留 .app 权限位）——解压一次即得可运行产物
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}
          if-no-files-found: error
          archive: false
