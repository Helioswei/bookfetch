name: build

# 每次推 main → 自动构建 mac/win 桌面包 → Actions artifact（最新包随时可取）；
# 正式对外发布打 tag（见 release.yml）。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-26          # Apple 芯片 (M1+)，macOS 26 镜像（翻译桥需 26 SDK）；Intel Mac 走 CLI/PyPI
            zip: bookfetch-macos-arm64.zip
            art: bookfetch-macos-arm64
          - label: windows-x64
            os: windows-latest
            zip: bookfetch-windows-x64.zip
            art: bookfetch-windows-x64
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/desktop-build
        with:
          zip-name: ${{ matrix.zip }}

      # upload-artifact 传目录会剥掉顶层目录名（dist/bookfetch.app → 打散成 Contents/…），
      # 先 stage 出「只含产物本体」的目录，再传 stage/* 保留 bookfetch.app / bookfetch 顶层名
      - name: Stage artifact (macOS)
        if: runner.os == 'macOS'
        run: mkdir -p stage && ditto dist/bookfetch.app stage/bookfetch.app   # ditto 保留权限/xattr，解压后双击可执行
      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        run: New-Item -ItemType Directory -Path stage -Force; Copy-Item -Recurse dist/bookfetch stage/bookfetch
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.art }}
          path: stage/*
          if-no-files-found: error
