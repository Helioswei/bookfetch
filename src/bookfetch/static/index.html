<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>bookfetch</title>
<link rel="stylesheet" href="vendor/pico.min.css"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<header class="topbar container-fluid">
  <div class="brand"><span class="word">bookfetch</span><span class="seal" title="藏书">藏</span></div>
  <nav class="tabs">
    <button id="tab-search" class="tab active" data-view="search">搜索</button>
    <button id="tab-shelf" class="tab" data-view="shelf">书架</button>
    <button id="tab-theme" title="切换明暗">🌗</button>
    <button id="tab-settings" title="设置">⚙️</button>
  </nav>
</header>

<!-- 设置面板（网络代理） -->
<div id="settings-modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <span class="modal-title">设置</span>
      <button class="modal-x" title="关闭">✕</button>
    </div>
    <div class="field">
      <div class="field-label">网络代理</div>
      <p class="field-hint">被墙书源（wikisource / libgen）需要代理才能访问。「跟随系统」= 自动使用 macOS 系统代理（Clash 等开着「系统代理」开关即可）。</p>
      <label class="radio-row"><input type="radio" name="proxy-mode" value="system" checked/> 跟随系统（默认）</label>
      <label class="radio-row"><input type="radio" name="proxy-mode" value="manual"/> 手动代理</label>
      <label class="radio-row"><input type="radio" name="proxy-mode" value="none"/> 直连（不走任何代理）</label>
      <input id="proxy-url" type="text" placeholder="http://127.0.0.1:7897" class="proxy-url"/>
    </div>
    <div class="modal-foot">
      <span id="settings-msg" class="muted"></span>
      <button id="settings-save" class="primary">保存</button>
    </div>
  </div>
</div>

<main class="container-fluid">
  <!-- ============ 搜索视图 ============ -->
  <section id="view-search" class="view">
    <form id="search-form" class="search-row">
      <input id="search-q" type="search" placeholder="书名 / 关键词，如 诡秘之主、本草纲目、Alice in Wonderland" autofocus required/>
      <div id="source-chips" class="chips"></div>
      <button type="submit">搜索</button>
    </form>
    <div id="search-meta" class="muted"></div>
    <div id="search-results" class="cards"></div>
  </section>

  <!-- ============ 书架视图 ============ -->
  <section id="view-shelf" class="view hidden">
    <div class="shelf-head">
      <h2>我的书架</h2>
      <span id="shelf-lib" class="muted"></span>
      <span class="spacer"></span>
      <button id="shelf-open-lib" title="在文件管理器中打开书库目录——手动放入 .txt/.epub 即上架">打开书库</button>
      <button id="shelf-import" title="选择电脑里的 .txt/.epub 文件，复制进书库上架">导入书籍</button>
      <input type="file" id="shelf-import-input" accept=".txt,.epub" multiple hidden>
    </div>
    <div id="shelf-empty" class="empty hidden">
      <p>书架还空着——去 <a href="#" id="empty-go-search">搜索</a> 下载第一本书，或点右上角「导入书籍」把本地的 txt/epub 放进书架</p>
    </div>
    <div id="shelf-books" class="cards"></div>
  </section>
</main>

<!-- ============ 阅读视图 ============ -->
<section id="view-reader" class="hidden">
  <header class="reader-top">
    <button id="reader-back">← 书架</button>
    <button id="reader-goto-search" title="回到搜索">搜索</button>
    <span id="reader-title" class="reader-title"></span>
    <span class="spacer"></span>
    <button id="reader-toc-toggle" title="目录">目录</button>
    <button id="reader-simp" title="简繁切换">繁</button>
    <button id="reader-tr" title="翻译本章（英译中，沉浸对照）" class="hidden">译</button>
    <button id="reader-aa" title="字号">Aa</button>
    <button id="reader-theme" title="夜间">🌙</button>
  </header>
  <div class="reader-main">
    <aside id="reader-toc" class="reader-toc hidden">
      <ul id="toc-list"></ul>
    </aside>
    <article id="reader-body" class="reader-body"></article>
    <footer class="reader-nav">
      <button id="reader-prev" class="outline">上一章</button>
      <span id="reader-pos" class="muted"></span>
      <button id="reader-next" class="outline">下一章</button>
    </footer>
  </div>
</section>

<!-- 下载任务面板（右下角常驻，可收起；D1） -->
<div id="tasks" class="tasks hidden">
  <div class="tasks-head">
    <span class="tasks-title">下载任务</span>
    <em id="tasks-badge" class="badge-count hidden"></em>
    <button id="tasks-toggle" class="tasks-toggle" title="收起/展开">▾</button>
  </div>
  <div id="tasks-list" class="tasks-list"></div>
</div>

<script src="app.js"></script>
</body>
</html>
