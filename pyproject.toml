[project]
name = "bookfetch"
version = "1.0.1"
description = "Ebook finder & downloader (desktop app + CLI): routes book queries to working sources — Chinese classics, web novels, public-domain English. JSON output for agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Helios Wei", email = "helioswei1995@gmail.com" }]
keywords = ["ebook", "ebooks", "chinese", "classics", "ctext", "webnovel", "gutenberg", "cli", "desktop-app", "agent"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
bookfetch = "bookfetch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookfetch"]

[project.optional-dependencies]
simp = ["opencc>=1.4"]
gui = ["pywebview>=5.0"]

[dependency-groups]
dev = ["pytest>=8.0", "opencc>=1.4"]
build = ["pyinstaller>=6.0"]
